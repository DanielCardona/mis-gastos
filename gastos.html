<style>

  .mnl{font-size:12px;font-weight:600;color:var(--text);min-width:90px;text-align:center;}

  .gtrack{height:4px;border-radius:2px;background:var(--border);overflow:hidden;margin-bottom:12px;}
  .gfill{height:100%;border-radius:2px;transition:width .5s,background .4s;}
  .tabs{display:flex;}
  .tab{flex:1;padding:8px 0;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-family:inherit;}

  .content{flex:1;padding:20px;overflow-y:auto;}

  .cat-list{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .cb{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;text-align:left;width:100%;font-family:inherit;}
  .cb.active{border-color:var(--gold);background:#1c1810;}
  .cb-emoji{font-size:22px;}.cb-info{flex:1;min-width:0;}.cb-name{font-size:13px;font-weight:600;color:var(--text);}

  .cb-mfill{height:100%;border-radius:2px;}
  .cb-right{text-align:right;flex-shrink:0;}.cb-spent{font-size:12px;font-weight:700;}.cb-of{font-size:10px;color:var(--muted);}

  .sstrip{background:var(--card);border-radius:14px;padding:16px;margin-bottom:20px;border:1px solid var(--border);}
  .sstrip-lbl{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
  .sstrip-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .sstrip-tot{font-size:26px;font-weight:700;}.sstrip-of{font-size:12px;color:var(--muted);}
  .sstrip-track{height:7px;border-radius:4px;background:var(--border);overflow:hidden;margin-bottom:10px;}
  .sstrip-fill{height:100%;border-radius:4px;transition:width .5s;}
  .sstrip-emojis{display:flex;justify-content:space-around;}
  .se{text-align:center;}.se-pct{font-size:10px;font-weight:700;margin-top:3px;}
  .gc{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border);}
  .gc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .gc-lbl{flex:1;font-size:14px;font-weight:600;}.gc-right{text-align:right;}
  .gc-spent{font-size:18px;font-weight:700;}.gc-of{font-size:11px;color:var(--muted);}
  .gc-track{height:8px;border-radius:4px;background:var(--border);overflow:hidden;margin-bottom:8px;}
  .gc-fill{height:100%;border-radius:4px;transition:width .5s;}
  .gc-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:14px;}
  .gc-meta .pct{font-weight:600;}.gc-irow{display:flex;gap:8px;}
  .gc-input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;font-family:inherit;-moz-appearance:textfield;}

  .gc-save{padding:9px 16px;border-radius:10px;border:none;background:var(--gold);color:var(--bg);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .past-note{font-size:11px;color:var(--muted);text-align:center;margin-bottom:16px;font-style:italic;}
  .mg{margin-bottom:28px;}.mt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
  .ei{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--faint);cursor:pointer;}
  .ei:active{opacity:.7;}
  .ei-emoji{font-size:22px;width:34px;text-align:center;flex-shrink:0;}
  .ei-body{flex:1;min-width:0;}.ei-cat{font-size:13px;font-weight:600;}

  .rc{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--border);}
  .rc-top{display:flex;align-items:center;gap:10px;margin-bottom:6px;}

  .ov{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);background:var(--card);border-top:1px solid var(--border);padding:20px;gap:10px;z-index:50;}

  .ovb{flex:1;padding:14px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
  .ovc{background:#2a2a30;color:#9090a0;}.ovd{background:#3a1515;color:var(--red);}
  .eov{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max-w);background:var(--card);border-top:1px solid var(--border);padding:20px 20px 32px;flex-direction:column;z-index:50;max-height:85vh;overflow-y:auto;}

</div>

function loadG(){try{var r=localStorage.getItem(GK);if(r)return JSON.parse(r);}catch(e){}localStorage.setItem(GK,JSON.stringify(SEED));return JSON.parse(JSON.stringify(SEED));}
function loadB(){try{var r=localStorage.getItem(BK);if(r)return JSON.parse(r);}catch(e){}localStorage.setItem(BK,JSON.stringify(SB));return JSON.parse(JSON.stringify(SB));}
function loadR(){try{var r=localStorage.getItem(RK);if(r)return JSON.parse(r);}catch(e){}localStorage.setItem(RK,JSON.stringify(SF));return JSON.parse(JSON.stringify(SF));}
function saveG(d){localStorage.setItem(GK,JSON.stringify(d));}
function saveB(d){localStorage.setItem(BK,JSON.stringify(d));}
function saveR(d){localStorage.setItem(RK,JSON.stringify(d));}
var gastos=loadG(),budgets=loadB(),fijos=loadR();
var view='add',selCat='alimentacion',delId=null,editId=null,editCat=null,expMode='month',recEditId=null,recDelId=null,rCatSel='recurrentes';
function ts(){return new Date().toISOString().split('T')[0];}
function tm(){return ts().slice(0,7);}
var vm=tm();
function fmts(n){return Number(n).toFixed(2).replace('.',',')+' euros';}
function mlabel(ym){var p=ym.split('-');var s=new Date(p[0],p[1]-1).toLocaleString('es-ES',{month:'long',year:'numeric'});return s.charAt(0).toUpperCase()+s.slice(1);}
function addM(ym,d){var p=ym.split('-');var dt=new Date(parseInt(p[0]),parseInt(p[1])-1+d,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function bc(pct){return pct>=100?'#e05555':pct>=80?'#e09020':'#52c98a';}
function spent(cId,ym){return gastos.filter(function(g){return g.date.startsWith(ym)&&g.category===cId;}).reduce(function(s,g){return s+g.amount;},0);}
function totM(ym){return gastos.filter(function(g){return g.date.startsWith(ym);}).reduce(function(s,g){return s+g.amount;},0);}
function totB(){return Object.values(budgets).reduce(function(s,v){return s+v;},0);}
function opct(ym){var tb=totB();return tb>0?Math.min((totM(ym)/tb)*100,100):0;}
function allMonths(){var map={};gastos.forEach(function(g){map[g.date.slice(0,7)]=true;});return Object.keys(map).sort(function(a,b){return b.localeCompare(a);});}
function gByM(ym){return gastos.filter(function(g){return g.date.startsWith(ym);});}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}
function syncFijos(){var changed=false;fijos.forEach(function(f){if(!f.startDate)return;var start=f.startDate.slice(0,7),end=f.endDate?f.endDate.slice(0,7):tm(),cur=start;while(cur<=end&&cur<=tm()){var key='fijo_'+f.id+'_'+cur;if(!gastos.some(function(g){return g.recKey===key;})){var day=(cur===start)?f.startDate:cur+'-01';gastos.push({id:Date.now()+Math.random(),amount:f.amount,category:f.category,note:f.name,date:day,recKey:key,isFijo:true});changed=true;}cur=addM(cur,1);}});if(changed)saveG(gastos);}
function updHeader(){var tot=totM(vm),tb=totB(),pct=opct(vm),isCur=(vm===tm());document.getElementById('hEye').textContent=isCur?'Este mes':'Mes seleccionado';document.getElementById('hNav').textContent=mlabel(vm);document.getElementById('hTot').textContent=Number(tot).toFixed(2).replace('.',',')+' \u20ac';document.getElementById('btnNext').disabled=(vm>=tm());var sub=document.getElementById('hSub');if(isCur){if(pct>=100){sub.innerHTML='Superado en '+Number(tot-tb).toFixed(2).replace('.',',')+' \u20ac';sub.className='header-sub over';}else{sub.textContent=Number(Math.max(tb-tot,0)).toFixed(2).replace('.',',')+' \u20ac restante de '+Number(tb).toFixed(2).replace('.',',')+' \u20ac';sub.className='header-sub';}}else{var d=tot-tb;sub.textContent=Number(tot).toFixed(2).replace('.',',')+' \u20ac '+(d>0?'(+'+Number(d).toFixed(2).replace('.',',')+' sobre objetivo)':'('+Number(-d).toFixed(2).replace('.',',')+' bajo objetivo)');sub.className=d>0?'header-sub over':'header-sub';}var f=document.getElementById('gFill');f.style.width=pct+'%';f.style.background=bc(pct);}
function changeMonth(d){var n=addM(vm,d);if(n>tm())return;vm=n;syncFijos();render();}
function setView(v){view=v;document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',['add','goals','rec','list','exp'][i]===v);});render();}
function render(){updHeader();var c=document.getElementById('content');if(view==='add')c.innerHTML=rAdd();if(view==='goals')c.innerHTML=rGoals();if(view==='rec')c.innerHTML=rRec();if(view==='list')c.innerHTML=rList();if(view==='exp')c.innerHTML=rExp();}
function fmt2(n){return Number(n).toFixed(2).replace('.',',')+' \u20ac';}
function catHTML(active,forM){var h='';CATS.forEach(function(c){var s=spent(c.id,forM),b=budgets[c.id]||0,p=b>0?Math.min((s/b)*100,100):0,col=bc(p),act=active===c.id;h+='<button class="cb'+(act?' active':'')+'" onclick="selCatFn(\''+c.id+'\')">'+'<span class="cb-emoji">'+c.emoji+'</span><div class="cb-info"><div class="cb-name">'+c.label+'</div>'+(b>0?'<div class="cb-mtrack"><div class="cb-mfill" style="width:'+p+'%;background:'+col+'"></div></div>':'')+'</div><div class="cb-right"><div class="cb-spent" style="color:'+col+'">'+fmt2(s)+'</div><div class="cb-of">de '+fmt2(b)+'</div></div></button>';});return h;}
function rAdd(){return '<label class="fl">Importe</label><input type="number" class="ai" id="fAmt" inputmode="decimal" placeholder="0,00"><label class="fl">Categoria</label><div class="cat-list" id="catList">'+catHTML(selCat,tm())+'</div><label class="fl">Nota (opcional)</label><input type="text" id="fNote" placeholder="Mercadona, gasolina, cena"><label class="fl">Fecha</label><input type="date" id="fDate" value="'+ts()+'"><button class="add-btn" id="addBtn" onclick="addG()">Anadir gasto</button>';}
function selCatFn(id){selCat=id;var cl=document.getElementById('catList');if(cl)cl.innerHTML=catHTML(selCat,tm());}
function addG(){var amt=parseFloat((document.getElementById('fAmt').value||'').replace(',','.'));if(!amt||amt<=0){toast('Introduce un importe');return;}var note=document.getElementById('fNote').value.trim();var date=document.getElementById('fDate').value||ts();gastos.unshift({id:Date.now(),amount:amt,category:selCat,note:note,date:date});saveG(gastos);vm=date.slice(0,7);var btn=document.getElementById('addBtn');btn.textContent='Guardado';btn.classList.add('saved');toast('Gasto guardado');setTimeout(function(){btn.textContent='Anadir gasto';btn.classList.remove('saved');},1800);document.getElementById('fAmt').value='';document.getElementById('fNote').value='';updHeader();var cl=document.getElementById('catList');if(cl)cl.innerHTML=catHTML(selCat,tm());}
function rGoals(){var ym=vm,tot=totM(ym),tb=totB(),p=opct(ym),isPast=ym<tm();var se='';CATS.forEach(function(c){var s=spent(c.id,ym),b=budgets[c.id]||0,pct=b>0?Math.min((s/b)*100,100):0;se+='<div class="se"><div style="font-size:18px">'+c.emoji+'</div><div class="se-pct" style="color:'+bc(pct)+'">'+Math.round(pct)+'%</div></div>';});var cards='';CATS.forEach(function(c){var s=spent(c.id,ym),b=budgets[c.id]||0,pct=b>0?(s/b)*100:0,col=bc(pct),left=Math.max(b-s,0);cards+='<div class="gc"><div class="gc-top"><span style="font-size:22px">'+c.emoji+'</span><div class="gc-lbl">'+c.label+'</div><div class="gc-right"><div class="gc-spent" style="color:'+col+'">'+fmt2(s)+'</div><div class="gc-of">de '+fmt2(b)+'</div></div></div><div class="gc-track"><div class="gc-fill" style="width:'+Math.min(pct,100)+'%;background:'+col+'"></div></div><div class="gc-meta"><span class="pct" style="color:'+col+'">'+Math.round(pct)+'% gastado</span><span>'+(pct>=100?'Superado':fmt2(left)+' restante')+'</span></div>'+(isPast?'':'<div class="gc-irow"><input type="number" class="gc-input" inputmode="decimal" id="gi_'+c.id+'" value="'+b+'"><button class="gc-save" onclick="saveGoal(\''+c.id+'\')">OK</button></div>')+'</div>';});return'<div class="sstrip"><div class="sstrip-lbl">'+mlabel(ym)+'</div><div class="sstrip-row"><span class="sstrip-tot">'+fmt2(tot)+'</span><span class="sstrip-of">/ '+fmt2(tb)+'</span></div><div class="sstrip-track"><div class="sstrip-fill" style="width:'+p+'%;background:'+bc(p)+'"></div></div><div class="sstrip-emojis">'+se+'</div></div>'+(isPast?'<div class="past-note">Mes cerrado</div>':'')+cards;}
function saveGoal(catId){var v=parseFloat((document.getElementById('gi_'+catId).value||'').replace(',','.'));budgets[catId]=isNaN(v)||v<0?0:v;saveB(budgets);toast('Objetivo guardado');render();}
function recStatusOf(r){if(!r.startDate)return'pending';var t=ts();if(r.startDate>t)return'pending';if(r.endDate&&r.endDate<t)return'ended';return'active';}
function rRec(){var h='<div class="rec-info">Los gastos fijos se insertan automaticamente cada mes. <b>Si la fecha inicio esta vacia</b>, esta pendiente de configurar.</div>';if(!fijos.length)h+='<div class="empty">Sin gastos fijos</div>';fijos.forEach(function(f){var st=recStatusOf(f),cat=CATS.find(function(c){return c.id===f.category;});var badge=st==='active'?'<span class="badge-active">Activo</span>':st==='pending'?'<span class="badge-pending">Sin configurar</span>':'<span class="badge-ended">Finalizado</span>';h+='<div class="rc"><div class="rc-top"><span class="rc-emoji">'+(cat?cat.emoji:'🔄')+'</span><div class="rc-lbl">'+f.name+'</div><div class="rc-amt">'+fmt2(f.amount)+'/mes</div></div><div class="rc-meta"><b>Categoria:</b> '+(cat?cat.label:f.category)+'<br><b>Inicio:</b> '+(f.startDate||'-')+' <b>Fin:</b> '+(f.endDate||'Indefinido')+'<br>'+badge+'</div><div class="rc-actions"><button class="rc-edit" onclick="openRecEdit('+f.id+')">Editar</button><button class="rc-del" onclick="askRecDel('+f.id+')">X</button></div></div>';});h+='<button class="rc-add" onclick="openRecNew()">+ Anadir gasto fijo</button>';return h;}
function rCatsHTML(active){var h='';CATS.forEach(function(c){var a=c.id===active;h+='<button class="rov-cb'+(a?' active':'')+'" onclick="selRCat(\''+c.id+'\')">'+'<span style="font-size:18px">'+c.emoji+'</span> '+c.label+'</button>';});return h;}
function selRCat(id){rCatSel=id;document.getElementById('rCats').innerHTML=rCatsHTML(rCatSel);}
function openRecNew(){recEditId=null;rCatSel='recurrentes';document.getElementById('recOvTitle').textContent='Nuevo gasto fijo';document.getElementById('rName').value='';document.getElementById('rAmt').value='';document.getElementById('rStart').value='';document.getElementById('rEnd').value='';document.getElementById('rCats').innerHTML=rCatsHTML(rCatSel);document.getElementById('recOv').classList.add('visible');}
function openRecEdit(id){var f=fijos.find(function(x){return x.id===id;});if(!f)return;recEditId=id;rCatSel=f.category;document.getElementById('recOvTitle').textContent='Editar gasto fijo';document.getElementById('rName').value=f.name;document.getElementById('rAmt').value=f.amount;document.getElementById('rStart').value=f.startDate||'';document.getElementById('rEnd').value=f.endDate||'';document.getElementById('rCats').innerHTML=rCatsHTML(rCatSel);document.getElementById('recOv').classList.add('visible');}
function saveRec(){var name=document.getElementById('rName').value.trim();var amt=parseFloat((document.getElementById('rAmt').value||'').replace(',','.'));var start=document.getElementById('rStart').value,end=document.getElementById('rEnd').value;if(!name){toast('Anade una descripcion');return;}if(!amt||amt<=0){toast('Introduce un importe');return;}if(recEditId){fijos=fijos.map(function(f){return f.id!==recEditId?f:Object.assign({},f,{name:name,amount:amt,category:rCatSel,startDate:start,endDate:end});});}else{fijos.push({id:Date.now(),name:name,amount:amt,category:rCatSel,startDate:start,endDate:end});}saveR(fijos);syncFijos();closeRecOv();toast('Guardado');render();}
function closeRecOv(){recEditId=null;document.getElementById('recOv').classList.remove('visible');}
function askRecDel(id){recDelId=id;document.getElementById('recDelOv').classList.add('visible');}
function closeRecDel(){recDelId=null;document.getElementById('recDelOv').classList.remove('visible');}
function confirmRecDel(){fijos=fijos.filter(function(f){return f.id!==recDelId;});saveR(fijos);closeRecDel();toast('Eliminado');render();}
function rList(){var months=allMonths();if(!months.length)return'<div class="empty">Sin gastos todavia</div>';var h='<div class="lhint">Toca un gasto para editar</div>';months.forEach(function(ym){var items=gByM(ym).slice().sort(function(a,b){return b.date.localeCompare(a.date);});var sub=items.reduce(function(s,g){return s+g.amount;},0),isCur=ym===vm,rows='';items.forEach(function(g){var cat=CATS.find(function(c){return c.id===g.category;});rows+='<div class="ei" onclick="openEdit('+g.id+')">'+'<div class="ei-emoji">'+(cat?cat.emoji:'📦')+'</div>'+'<div class="ei-body"><div class="ei-cat">'+(cat?cat.label:g.category)+(g.isFijo?'<span class="badge-rec">fijo</span>':'')+'</div>'+(g.note?'<div class="ei-note">'+g.note+'</div>':'<div class="ei-note" style="color:var(--faint)">Sin descripcion</div>')+'<div class="ei-date">'+g.date+'</div></div>'+'<div class="ei-amt">'+fmt2(g.amount)+'</div>'+'<button class="del-btn" onclick="event.stopPropagation();askDel('+g.id+')">x</button></div>';});h+='<div class="mg"><div class="mt" style="'+(isCur?'color:var(--gold)':'')+'">'+mlabel(ym)+' - '+fmt2(sub)+(isCur?' - este mes':'')+'</div>'+rows+'</div>';});return h;}
function openEdit(id){editId=id;var g=gastos.find(function(x){return x.id===id;});editCat=g?g.category:CATS[0].id;document.getElementById('editNote').value=g?(g.note||''):'';buildEditCats();document.getElementById('editOv').classList.add('visible');}
function buildEditCats(){var h='';CATS.forEach(function(c){var a=c.id===editCat;h+='<button class="ecb'+(a?' active':'')+'" onclick="selEditCat(\''+c.id+'\')">'+'<span style="font-size:20px">'+c.emoji+'</span> '+c.label+'</button>';});document.getElementById('editCats').innerHTML=h;}
function selEditCat(id){editCat=id;buildEditCats();}
function saveEdit(){var note=document.getElementById('editNote').value.trim();gastos=gastos.map(function(g){return g.id!==editId?g:Object.assign({},g,{note:note,category:editCat});});saveG(gastos);closeEdit();toast('Actualizado');render();}
function closeEdit(){editId=null;editCat=null;document.getElementById('editOv').classList.remove('visible');}
function rExp(){return'<div class="etoggle"><button class="etbtn'+(expMode==='month'?' active':'')+'" onclick="setEM(\'month\')">Este mes</button><button class="etbtn'+(expMode==='all'?' active':'')+'" onclick="setEM(\'all\')">Historico</button></div><button class="copy-btn" id="copyBtn" onclick="doCopy()">Copiar para Claude</button><div class="ehint">Si no funciona toca el texto de abajo</div><div class="pl">Vista previa</div><div class="sab" id="sab" onclick="selAll()">'+genSummary().replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>';}
function setEM(m){expMode=m;render();}
function genSummary(){if(!gastos.length)return'Sin gastos';var tb=totB();if(expMode==='month'){var ym=vm,tot=totM(ym),pct=tb>0?Math.round((tot/tb)*100):0;var t='RESUMEN - '+mlabel(ym)+'\n\nOBJETIVOS VS GASTO\n';CATS.forEach(function(c){var s=spent(c.id,ym),p=budgets[c.id]>0?Math.round((s/budgets[c.id])*100):0;t+='  '+c.label+': '+fmt2(s)+' / '+fmt2(budgets[c.id])+' ('+p+'%)\n';});t+='  TOTAL: '+fmt2(tot)+' / '+fmt2(tb)+' ('+pct+'%)\n\nDETALLE\n';gByM(ym).slice().sort(function(a,b){return b.date.localeCompare(a.date);}).forEach(function(g){var c=CATS.find(function(x){return x.id===g.category;});t+='  '+g.date+' '+( c?c.label:g.category)+' '+fmt2(g.amount);if(g.note)t+=' - '+g.note;t+='\n';});return t;}else{var months=allMonths();var t='HISTORICO COMPLETO\n\nOBJETIVOS\n';CATS.forEach(function(c){t+='  '+c.label+': '+fmt2(budgets[c.id])+'\n';});t+='  TOTAL: '+fmt2(tb)+'\n\n';months.forEach(function(ym){var tot=totM(ym),pct=tb>0?Math.round((tot/tb)*100):0;t+='\n'+mlabel(ym).toUpperCase()+' - '+fmt2(tot)+' ('+pct+'%)\n';CATS.forEach(function(c){var s=spent(c.id,ym);if(s>0){var p=budgets[c.id]>0?Math.round((s/budgets[c.id])*100):0;t+='  '+c.label+': '+fmt2(s)+' ('+p+'%)\n';}});t+='\n';gByM(ym).slice().sort(function(a,b){return b.date.localeCompare(a.date);}).forEach(function(g){var c=CATS.find(function(x){return x.id===g.category;});t+='  '+g.date+' '+(c?c.label:g.category)+' '+fmt2(g.amount);if(g.note)t+=' - '+g.note;t+='\n';});});return t;}}
function doCopy(){var text=genSummary(),btn=document.getElementById('copyBtn');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){flashC(btn);}).catch(function(){fbCopy(text,btn);});}else fbCopy(text,btn);}
function fbCopy(text,btn){var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');flashC(btn);}catch(e){toast('Toca el texto para copiarlo');}document.body.removeChild(ta);}
function flashC(btn){if(!btn)return;btn.textContent='Copiado';btn.classList.add('copied');toast('Copiado');setTimeout(function(){btn.textContent='Copiar para Claude';btn.classList.remove('copied');},2500);}
function selAll(){var el=document.getElementById('sab');if(!el)return;var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);}
function askDel(id){delId=id;document.getElementById('delOv').classList.add('visible');}
function closeDel(){delId=null;document.getElementById('delOv').classList.remove('visible');}
function confirmDel(){gastos=gastos.filter(function(g){return g.id!==delId;});saveG(gastos);closeDel();toast('Eliminado');render();}
syncFijos();
render();
